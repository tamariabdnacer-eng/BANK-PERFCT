<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Perfect Card</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body {background: linear-gradient(135deg,#0f2027,#00545f,#000a61fd);color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;transition:background 0.5s;}
.box {background: rgba(255,255,255,0.05);backdrop-filter:blur(10px);width:400px;padding:25px;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,0.6);transition:transform 0.3s, box-shadow 0.3s;}
.box:hover {transform:translateY(-5px); box-shadow:0 15px 40px rgba(0,0,0,0.7);}
h2,h3 {text-align:center;font-weight:600;}
.section {margin-bottom:25px;}
input,button {width:100%;padding:10px 12px;margin-top:8px;border:none;border-radius:8px;font-size:15px;outline:none;transition:all 0.3s;}
input {background: rgba(255,255,255,0.1);color:#fff;}
input::placeholder {color:#ddd;}
input:focus {background: rgba(255,255,255,0.2); box-shadow:0 0 5px #0984e3;}
button {background:linear-gradient(90deg,#009c94,#0004ff);color:#fff;font-weight:bold;cursor:pointer;}
button:hover {background:linear-gradient(90deg,#04fff2bd,#00eeff);transform:scale(1.05);}
.danger {background:linear-gradient(90deg,#e74c3c,#d63031);}
.danger:hover {background:linear-gradient(90deg,#ff7675,#e17055);}
#msg,#msgMain,#msgForgot,#msgRegister,#msgQR,#msgRefresh {text-align:center;margin-top:6px;font-weight:bold;}
a {text-decoration:none;color:#00ff22;cursor:pointer;}
video {width:100%;border-radius:12px;margin-top:10px;}
.history {background: rgba(0,0,0,0.3);padding:12px;max-height:160px;overflow-y:auto;font-size:14px;border-radius:8px;box-shadow: inset 0 0 5px rgba(255,255,255,0.1);}
.history::-webkit-scrollbar {width:6px;}
.history::-webkit-scrollbar-thumb {background:#0004ff;border-radius:3px;}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
</head>
<body>

<!-- Login -->
<div id="loginDiv" class="box">
  <h3>🔐 تسجيل الدخول</h3>
  <input id="username" placeholder="اسم المستخدم">
  <input id="password" type="password" placeholder="كلمة المرور">
  <label style="display:flex;align-items:center;margin-top:10px;"><input type="checkbox" id="rememberMe"> تذكرني</label>
  <button onclick="login()">دخول</button>
  <p style="text-align:center; margin-top:10px;"><a onclick="showForgot()">نسيت كلمة السر؟</a></p>
  <hr style="margin:15px 0; border-color: rgba(255,255,255,0.2)">
  <h3>🆕 إنشاء حساب</h3>
  <button onclick="showRegister()">تسجيل جديد</button>
  <p id="msg"></p>
</div>

<div id="registerDiv" class="box" style="display:none">
  <h3>🆕 إنشاء حساب</h3>
  <input id="regUsername" placeholder="اسم المستخدم">
  <input id="regPassword" type="password" placeholder="كلمة المرور">
  <button onclick="register()">تسجيل</button>
  <p id="msgRegister"></p>
  <button onclick="backToLogin()" style="margin-top:10px; background:#e67e22;">⬅ العودة لتسجيل الدخول</button>
</div>

<div id="forgotDiv" class="box" style="display:none">
  <h3>🔑 نسيت كلمة السر</h3>
  <input id="forgotUsername" placeholder="اسم المستخدم">
  <input id="forgotPin" type="number" placeholder="رمز الأمان PIN">
  <input id="newPassword" type="password" placeholder="كلمة المرور الجديدة">
  <button onclick="resetPassword()">تحديث كلمة السر</button>
  <p id="msgForgot"></p>
  <button onclick="backToLogin()" style="margin-top:10px; background:#e67e22;">⬅ العودة لتسجيل الدخول</button>
</div>

<!-- Main -->
<div id="mainDiv" class="box" style="display:none">
  <div style="text-align:center; margin-bottom:15px;">
    <img src="cart.png" alt="البنك بيرفكت" style="width:400px;">
  </div>
  <div class="section">
    <h3></h3>
    <div class="balance-card">
      <div class="chip"></div>
      <div class="balance-box">
        <span class="balance-title">رصيدك </span>
        <div class="balance-row">
          <span class="currency">$</span>
          <span class="balance-amount" id="balance">0</span>
        </div>
        <span class="balance-note"> اسم مستخدم </span>
      </div>
      <div class="user-name" id="userNameDisplay">اسم المستخدم</div>
    </div>

    <button onclick="refreshBalance()">🔄 تحديث الرصيد</button>
    <p id="msgRefresh"></p>
  </div>

  <div class="section section-card">
    <h3>🔑 شحن الرصيد</h3>
    <input id="codeInput" placeholder="كود الشحن">
    <button onclick="recharge()">شحن</button>
    <p id="msgMain"></p>
  </div>

  <div class="section section-card">
    <h3>💳 البطاقة</h3>
    <div class="card-display">
      <div class="chip"></div>
      <h3 id="cardNumber">غير موجود</h3>
      <div class="amount" id="cvv">---</div>
      <div class="user-name">Card Holder: <span id="userNameCard">---</span></div>
    </div>
    <button onclick="createCard()">إنشاء بطاقة</button>
  </div>

  <div class="section section-card">
    <h3>🔁 تحويل رصيد</h3>
    <input id="toUser" placeholder="اسم المستخدم">
    <input id="transferAmount" type="number" placeholder="المبلغ">
    <button onclick="transferMoney()">تحويل</button>
  </div>
  <div class="section section-card">
    <h3>📱 الدفع من المتجر</h3>
    <button onclick="startQRPay()">مسح QR للدفع</button>
    <video id="video" style="display:none"></video>
    <p id="msgQR"></p>
  </div>

  <div class="section">
    <h3>📜 سجل العمليات</h3>
    <div id="history" class="history"></div>
  </div>

  <div class="section">
    <button class="danger" onclick="logout()">🚪 تسجيل خروج</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCHtLGEvbtPSnaEN0p7wLiFE9cFOIDavgY",
  authDomain: "nacer-bfed2.firebaseapp.com",
  databaseURL: "https://nacer-bfed2-default-rtdb.firebaseio.com",
  projectId: "nacer-bfed2",
  storageBucket: "nacer-bfed2.firebasestorage.app",
  messagingSenderId: "669038764806",
  appId: "1:669038764806:web:31ae988f04ce9341f9b487"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = null;
let users = {};
let rechargeCodes = { "A80X":8,"B25Y":2,"C500Z":5,"C0050Z":5,"D100Q":1,"E200W":2,"E2000W":2,"VIP300":3,"VIP350":30,"F150R":10,"G75M":75,"H60N":60,"I90K":90,"J120L":1,"K180P":10,"L220S":220,"M400T":400,"N600U":600,"O800V":8,"P1000X":1,"Q50A":5,"R30B":3,"S70C":7,"T250D":2,"U450E":4,"V550F":5,"W750G":7,"W750G11":7,"X900H":9,"VIP500":50};

function saveUsers(){ db.ref('users').set(users); }
function loadUsers(callback){ db.ref('users').once('value').then(snap=>{ users=snap.val()||{}; callback(); }); }

// ---------------- تسجيل الدخول ----------------
function login(){
  let u=document.getElementById('username').value.trim();
  let p=document.getElementById('password').value.trim();
  const msg=document.getElementById('msg');
  const rememberMe=document.getElementById('rememberMe').checked;
  loadUsers(()=>{
    if(!users[u] || users[u].password!==p){ msg.innerText="❌ بيانات خاطئة"; return; }
    currentUser=u;
    if(rememberMe) localStorage.setItem('rememberedUser',u);
    document.getElementById('loginDiv').style.display="none";
    document.getElementById('mainDiv').style.display="block";
    initUserUI();
  });
}

// ---------------- استعادة المستخدم عند التحديث ----------------
window.onload = function(){
  const remembered = localStorage.getItem('rememberedUser');
  if(remembered){
    currentUser = remembered;
    loadUsers(()=>{
      if(users[currentUser]){
        document.getElementById('loginDiv').style.display="none";
        document.getElementById('mainDiv').style.display="block";
        initUserUI();
      } else {
        localStorage.removeItem('rememberedUser');
      }
    });
  }
}

// ---------------- باقي الوظائف ----------------
function showRegister(){ document.getElementById('loginDiv').style.display='none'; document.getElementById('registerDiv').style.display='block'; }
function register(){
  let u=document.getElementById('regUsername').value.trim();
  let p=document.getElementById('regPassword').value.trim();
  const msg=document.getElementById('msgRegister');
  if(!u||!p){ msg.innerText="❌ املأ جميع الحقول"; return; }
  loadUsers(()=>{
    if(users[u]){ msg.innerText="❌ المستخدم موجود"; return; }
    let pin=Math.floor(1000+Math.random()*9000);
    users[u]={password:p,balance:0,history:[],cardNumber:null,cvv:null,pin:pin};
    saveUsers();
    msg.innerText=`✅ تم إنشاء الحساب بنجاح. رمز الأمان الخاص بك هو: ${pin}`;
  });
}

function backToLogin(){ document.getElementById('registerDiv').style.display='none'; document.getElementById('forgotDiv').style.display='none'; document.getElementById('loginDiv').style.display='block'; }
function showForgot(){ document.getElementById('loginDiv').style.display='none'; document.getElementById('forgotDiv').style.display='block'; }
function resetPassword(){
  let u=document.getElementById('forgotUsername').value.trim();
  let pin=document.getElementById('forgotPin').value.trim();
  let newPass=document.getElementById('newPassword').value.trim();
  let msg=document.getElementById('msgForgot');
  if(!u||!pin||!newPass){ msg.innerText="❌ املأ جميع الحقول"; return; }
  loadUsers(()=>{
    if(!users[u]){ msg.innerText="❌ المستخدم غير موجود"; return; }
    if(users[u].pin!=pin){ msg.innerText="❌ رمز الأمان غير صحيح"; return; }
    users[u].password=newPass;
    saveUsers();
    msg.innerText="✅ تم تحديث كلمة السر بنجاح";
  });
}

function initUserUI(){
  let user=users[currentUser];
  user.balance=user.balance||0;
  user.history=user.history||[];
  user.cardNumber=user.cardNumber||null;
  user.cvv=user.cvv||null;
  document.getElementById("balance").innerText=user.balance;
  document.getElementById("userNameDisplay").innerText=currentUser;
  document.getElementById("cardNumber").innerText=user.cardNumber||"غير موجود";
  document.getElementById("cvv").innerText=user.cvv||"---";
  document.getElementById("userNameCard").innerText=currentUser;
  showHistory();
}

function recharge(){
  let code=document.getElementById('codeInput').value.trim();
  let msg=document.getElementById('msgMain');
  let user=users[currentUser];
  if(!(code in rechargeCodes)){ msg.innerText="❌ كود غير صالح أو مستخدم"; return; }
  let amount=rechargeCodes[code];
  user.balance+=amount;
  user.history.push(`💰 شحن +${amount}$ (كود ${code})`);
  delete rechargeCodes[code];
  document.getElementById("balance").innerText=user.balance;
  msg.innerText=`✅ تم شحن ${amount}$`;
  saveUsers();
  showHistory();
}

function createCard(){
  let user=users[currentUser];
  if(user.cardNumber){ alert("❌ لديك بطاقة بالفعل"); return; }
  user.cardNumber="4000-"+Math.floor(1000+Math.random()*9000)+"-"+Math.floor(1000+Math.random()*9000)+"-"+Math.floor(1000+Math.random()*9000);
  user.cvv=Math.floor(100+Math.random()*900);
  user.history.push("💳 إنشاء بطاقة");
  document.getElementById("cardNumber").innerText=user.cardNumber;
  document.getElementById("cvv").innerText=user.cvv;
  document.getElementById("userNameCard").innerText=currentUser;
  saveUsers();
  showHistory();
}

function transferMoney(){
  let toUser=document.getElementById('toUser').value.trim();
  let amount=parseInt(document.getElementById('transferAmount').value,10);
  let user=users[currentUser];
  if(!users[toUser]) return alert("❌ المستخدم غير موجود");
  if(toUser===currentUser) return alert("❌ لا يمكن التحويل لنفسك");
  if(!amount||amount<=0) return alert("❌ مبلغ غير صحيح");
  if(amount>10000) return alert("❌ المبلغ كبير جدًا");
  if(user.balance<amount) return alert("❌ رصيد غير كافي");
  user.balance-=amount;
  users[toUser].balance+=amount;
  user.history.push(`🔁 تحويل -${amount}$ إلى ${toUser}`);
  users[toUser].history=users[toUser].history||[];
  users[toUser].history.push(`🔁 تحويل +${amount}$ من ${currentUser}`);
  document.getElementById("balance").innerText=user.balance;
  alert("✅ تم التحويل");
  saveUsers();
  showHistory();
}

function showHistory(){
  let box=document.getElementById("history");
  if(!box) return;
  let user=users[currentUser];
  box.innerHTML="";
  user.history.forEach(h=>{
    let p=document.createElement("p");
    p.innerText=h;
    box.appendChild(p);
  });
}

// تحديث الرصيد
function refreshBalance(){
  let msg=document.getElementById("msgRefresh");
  msg.innerText="⏳ جاري التحديث...";
  loadUsers(()=>{
    if(!users[currentUser]){ msg.innerText="❌ حدث خطأ"; return; }
    let u=users[currentUser];
    document.getElementById("balance").innerText=u.balance||0;
    document.getElementById("cardNumber").innerText=u.cardNumber||"غير موجود";
    document.getElementById("cvv").innerText=u.cvv||"---";
    showHistory();
    msg.innerText="✅ تم تحديث الرصيد";
    setTimeout(()=>msg.innerText="",1500);
  });
}

function logout(){ 
  currentUser=null; 
  localStorage.removeItem('rememberedUser');
  location.reload(); 
}

// ---------------- QR Pay ----------------
let video = document.getElementById('video');
let scanning = false;
function startQRPay(){
  if(scanning) return;
  scanning = true;
  video.style.display='block';
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
    .then(stream=>{video.srcObject=stream; video.setAttribute("playsinline",true); video.play(); tick();})
    .catch(err=>{document.getElementById('msgQR').innerText="❌ لم نتمكن من الوصول للكاميرا"; scanning=false;});
}

function tick(){
  if(video.readyState===video.HAVE_ENOUGH_DATA){
    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    let ctx = canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let code = jsQR(imageData.data, canvas.width, canvas.height);
    if(code){ processQRPayment(code.data); stopVideo(); return; }
  }
  if(scanning) requestAnimationFrame(tick);
}

function stopVideo(){ scanning=false; video.srcObject.getTracks().forEach(track=>track.stop()); video.style.display='none'; }

function processQRPayment(data){
  let msg=document.getElementById('msgQR');
  let payment;
  try{ payment=JSON.parse(data); } catch(e){ msg.innerText="❌ QR غير صالح"; return; }
  let fromUser=users[currentUser];
  let toUser=payment.storeId;
  if(!users[toUser]){ msg.innerText="❌ اسم المستخدم المستلم غير موجود"; return; }
  if(fromUser.balance<payment.amount){ msg.innerText="❌ رصيد غير كافي"; return; }
  fromUser.balance-=payment.amount;
  fromUser.history.push(`📱 دفع ${payment.amount}$ إلى ${toUser}`);
  users[toUser].balance+=payment.amount;
  users[toUser].history=users[toUser].history||[];
  users[toUser].history.push(`📱 استلام ${payment.amount}$ من ${currentUser}`);
  document.getElementById("balance").innerText=fromUser.balance;
  saveUsers();
  showHistory();
  msg.innerText=`✅ تم الدفع بنجاح إلى ${toUser}`;
}
</script>
</body>
    </html>
